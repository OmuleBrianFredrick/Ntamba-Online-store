<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="sunGlowW" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </radialGradient>
    <linearGradient id="leafGradLeftW" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#86EFAC" />
    </linearGradient>
    <linearGradient id="leafGradRightW" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#14532D" />
      <stop offset="60%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#BBF7D0" />
    </linearGradient>
    <linearGradient id="goldGrainW" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <style>
      .ntamba-main-w { font-family: 'Outfit', 'Montserrat', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 900; }
      .ntamba-sub-w { font-family: 'Outfit', 'Montserrat', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 800; }
      .ntamba-tag-w { font-family: 'Outfit', 'Montserrat', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 800; }
    </style>
  </defs>

  <!-- LEFT EMBLEM -->
  <g transform="translate(20, 20) scale(0.56)">
    <!-- 1. Outer Cog Wheel in Bright Agroecology Emerald -->
    <g id="cog-wheel-w" fill="#15803D">
      <path d="
        M 220 30 L 280 30 L 274 72 A 190 190 0 0 1 340 99 L 378 80 L 408 132 L 377 161 A 190 190 0 0 1 404 227 L 446 220 L 446 280 L 404 273 A 190 190 0 0 1 377 339 L 408 368 L 378 420 L 340 401 A 190 190 0 0 1 274 428 L 280 470 L 220 470 L 226 428 A 190 190 0 0 1 160 401 L 122 420 L 92 368 L 123 339 A 190 190 0 0 1 96 273 L 54 280 L 54 220 L 96 227 A 190 190 0 0 1 123 161 L 92 132 L 122 80 L 160 99 A 190 190 0 0 1 226 72 Z
      " />
      <circle cx="250" cy="250" r="162" fill="#FFFFFF" />
      <circle cx="250" cy="250" r="150" fill="none" stroke="#F59E0B" stroke-width="7" />
    </g>

    <!-- 2. Inner Golden Horizon / Rising Sun -->
    <g id="rising-sun-w">
      <circle cx="250" cy="180" r="42" fill="url(#sunGlowW)" />
      <polygon points="250,118 244,136 256,136" fill="#F59E0B" />
      <polygon points="210,132 212,148 223,142" fill="#F59E0B" />
      <polygon points="180,162 195,170 199,158" fill="#F59E0B" />
      <polygon points="172,202 189,200 188,188" fill="#F59E0B" />
      <polygon points="290,132 277,142 288,148" fill="#F59E0B" />
      <polygon points="320,162 301,158 305,170" fill="#F59E0B" />
      <polygon points="328,202 312,188 311,200" fill="#F59E0B" />
    </g>

    <!-- 3. Agricultural Field Furrows -->
    <g id="furrows-w">
      <path d="M 145 315 C 160 300 205 310 230 335 C 190 355 155 345 145 315 Z" fill="#D97706" />
      <path d="M 155 330 C 175 320 215 330 235 355 C 205 372 175 365 155 330 Z" fill="#F59E0B" />
      <path d="M 170 355 C 190 345 225 355 240 375 C 215 385 190 380 170 355 Z" fill="#B45309" />
    </g>

    <!-- 4. Left Crop Cluster: Golden Corn / Coffee Beans -->
    <g id="corn-coffee-cluster-w" fill="url(#goldGrainW)">
      <path d="M 148 245 C 145 210 185 200 195 240 C 200 270 180 300 160 300 C 145 300 150 270 148 245 Z" />
      <ellipse cx="162" cy="225" rx="5" ry="7" fill="#FFFFFF" opacity="0.8" />
      <ellipse cx="178" cy="225" rx="5" ry="7" fill="#FFFFFF" opacity="0.8" />
      <ellipse cx="156" cy="242" rx="6" ry="8" fill="#FFFFFF" opacity="0.7" />
      <ellipse cx="172" cy="242" rx="6" ry="8" fill="#FFFFFF" opacity="0.7" />
      <ellipse cx="188" cy="245" rx="5" ry="7" fill="#FFFFFF" opacity="0.7" />
      <ellipse cx="160" cy="262" rx="6" ry="8" fill="#FFFFFF" opacity="0.7" />
      <ellipse cx="176" cy="262" rx="6" ry="8" fill="#FFFFFF" opacity="0.7" />
      <ellipse cx="166" cy="280" rx="5" ry="7" fill="#FFFFFF" opacity="0.6" />
    </g>

    <!-- 5. Right Crop Cluster: Golden Wheat / Grain Ear -->
    <g id="wheat-sheaf-w" fill="url(#goldGrainW)">
      <path d="M 270 305 Q 295 260 335 220 C 330 240 315 270 295 295 Z" />
      <path d="M 282 280 C 275 270 282 258 296 260 C 298 272 290 282 282 280 Z" fill="#FDE047" />
      <path d="M 302 265 C 295 255 302 243 316 245 C 318 257 310 267 302 265 Z" fill="#F59E0B" />
      <path d="M 292 250 C 285 240 292 228 306 230 C 308 242 300 252 292 250 Z" fill="#FDE047" />
      <path d="M 314 235 C 307 225 314 213 328 215 C 330 227 322 237 314 235 Z" fill="#F59E0B" />
      <path d="M 306 220 C 299 210 306 198 320 200 C 322 212 314 222 306 220 Z" fill="#FDE047" />
      <path d="M 324 205 C 320 195 328 185 338 190 C 338 200 332 208 324 205 Z" fill="#F59E0B" />
    </g>

    <!-- 6. Central Vibrant Green Foliage -->
    <path d="M 245 375 C 230 330 195 275 140 245 C 160 295 210 350 245 375 Z" fill="url(#leafGradLeftW)" />
    <path d="M 240 370 C 215 320 180 270 145 248 C 175 270 215 320 240 370 Z" fill="#4ADE80" opacity="0.8" />
    <path d="M 252 385 C 250 310 242 220 230 170 C 265 215 268 310 252 385 Z" fill="url(#leafGradRightW)" />
    <path d="M 252 380 C 248 300 248 230 236 185 C 255 220 258 290 252 380 Z" fill="#86EFAC" opacity="0.7" />
    <path d="M 255 375 C 270 320 310 245 365 205 C 350 270 300 345 255 375 Z" fill="url(#leafGradRightW)" />
    <path d="M 258 370 C 285 315 325 250 360 212 C 335 255 295 320 258 370 Z" fill="#4ADE80" opacity="0.8" />
    <path d="M 345 205 C 375 210 395 240 390 270 C 375 265 365 245 350 225 Z" fill="#22C55E" />
  </g>

  <!-- RIGHT TYPOGRAPHY FOR DARK BACKGROUNDS -->
  <g transform="translate(325, 0)">
    <!-- "Ntamba" Wordmark in Crisp Clean White -->
    <text x="0" y="145" class="ntamba-main-w" font-size="142" fill="#FFFFFF" letter-spacing="-1.5">Ntamba</text>

    <!-- "PROCESSORS" in Luminous Agro Gold -->
    <text x="5" y="202" class="ntamba-sub-w" font-size="52" fill="#FBBF24" letter-spacing="9.5">PROCESSORS</text>

    <!-- Golden Separation Rule -->
    <rect x="5" y="218" width="560" height="6.5" rx="3.25" fill="#FBBF24" />

    <!-- "AGRICULTURAL VALUE ADDITION" in Clean Ivory White -->
    <text x="5" y="258" class="ntamba-tag-w" font-size="28.5" fill="#E2E8F0" letter-spacing="3.2">AGRICULTURAL VALUE ADDITION</text>
  </g>
</svg>
